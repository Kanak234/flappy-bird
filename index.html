<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flappy Bird</title>
        <link rel="stylesheet" href="flappybird.css">
        <script src="flappybird.js" defer></script>
    </head>
    <body>
        <!--
            The canvas is the complete game surface. The accessible label and fallback text
            give screen readers and browsers without canvas support a useful description,
            without changing the existing JavaScript game loop or controls.
        -->
        <canvas id="board" aria-label="Flappy Bird game" role="img">
            Flappy Bird game. Use Space, Arrow Up, or X to make the bird jump.
        </canvas>
    </body>
</html>
